name: Google OTA Prober

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Probe OTA
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          set -e
          for file in config/*.yml config/*.yaml; do
            [ -f "$file" ] || continue
            python probe.py -c "$file"
            echo "//"
          done

      - name: Download full OTA and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release.sh

      - name: Upload metadata for workflow diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ota-prober-results
          path: update_info.json
          if-no-files-found: ignore
